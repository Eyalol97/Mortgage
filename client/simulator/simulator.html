<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortgage Simulator | Guided Clarity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/style.css" />
</head>
<body>

  <div id="navbar-root"></div>

  <main class="simulator-page">

    <div id="disclaimer"></div>

    <h1 class="simulator-page__title">Mortgage Simulator</h1>
    <p class="simulator-page__subtitle">
      Fill in any 3 of the 4 financial fields and press <strong>Solve</strong>
      to calculate the missing value.
    </p>

    <!-- ── Input form ────────────────────────────────────────────────────── -->
    <section class="simulator-form" aria-label="Mortgage inputs">

      <div class="simulator-form__mandatory">
        <h2 class="simulator-form__section-title">Loan Settings</h2>

        <div class="simulator-form__field">
          <label for="repaymentMethod">Repayment Method</label>
          <select id="repaymentMethod" name="repaymentMethod">
            <option value="">— Select —</option>
            <option value="shpitzer">Shpitzer (Fixed Payment)</option>
            <option value="keren-shava">Equal Principal (Keren Shava)</option>
            <option value="bullet">Bullet (Interest Only)</option>
          </select>
        </div>

        <div class="simulator-form__field">
          <label for="interestMethod">Interest Method</label>
          <select id="interestMethod" name="interestMethod">
            <option value="">— Select —</option>
            <option value="prime-linked">Prime-Linked</option>
            <option value="fixed">Fixed</option>
            <option value="cpi-linked">CPI-Linked</option>
          </select>
        </div>

        <div class="simulator-form__field">
          <label for="annualRate">Annual Interest Rate (%) <span class="simulator-form__optional">— optional, leave empty for market default</span></label>
          <input type="number" id="annualRate" name="annualRate"
                 min="0" step="0.01" placeholder="e.g. 4.5" />
        </div>
      </div>

      <div class="simulator-form__financial">
        <h2 class="simulator-form__section-title">Financial Fields <span class="simulator-form__hint">(fill exactly 3 of 4)</span></h2>

        <div class="simulator-form__field">
          <label for="propertyPrice">Property Price (₪)</label>
          <input type="number" id="propertyPrice" name="propertyPrice"
                 min="0" step="1000" placeholder="e.g. 2000000" />
        </div>

        <div class="simulator-form__field">
          <label for="equity">Equity / Down Payment (₪)</label>
          <input type="number" id="equity" name="equity"
                 min="0" step="1000" placeholder="e.g. 600000" />
        </div>

        <div class="simulator-form__field">
          <label for="duration">Loan Duration (years)</label>
          <input type="number" id="duration" name="duration"
                 min="1" max="30" step="1" placeholder="e.g. 25" />
        </div>

        <div class="simulator-form__field">
          <label for="monthlyPayment">Monthly Payment (₪)</label>
          <input type="number" id="monthlyPayment" name="monthlyPayment"
                 min="0" step="100" placeholder="e.g. 5500" />
        </div>
      </div>

      <div class="simulator-form__actions">
        <button id="solve-btn" class="btn btn--primary" disabled>Solve</button>
      </div>

    </section>

    <!-- ── Results ───────────────────────────────────────────────────────── -->
    <section id="results-section" class="simulator-results" hidden aria-live="polite">
      <h2 class="simulator-results__title">Results</h2>

      <div class="simulator-results__solved">
        <span class="simulator-results__solved-label" id="results-solved-label"></span>:
        <strong class="simulator-results__solved-value" id="results-solved-value"></strong>
      </div>

      <div class="simulator-results__summary">
        <div class="simulator-results__item">
          <span class="simulator-results__item-label">Monthly Payment</span>
          <span class="simulator-results__item-value" id="results-monthly-payment">—</span>
        </div>
        <div class="simulator-results__item">
          <span class="simulator-results__item-label">Total Interest</span>
          <span class="simulator-results__item-value" id="results-total-interest">—</span>
        </div>
        <div class="simulator-results__item">
          <span class="simulator-results__item-label">Total Payment</span>
          <span class="simulator-results__item-value" id="results-total-payment">—</span>
        </div>
      </div>

      <div class="simulator-results__actions">
        <button id="show-amort-btn" class="btn btn--secondary">View Amortization Schedule</button>
        <button id="save-mix-btn"   class="btn btn--secondary" hidden>Save as Mix</button>
      </div>
    </section>

    <!-- ── Mix manager ───────────────────────────────────────────────────── -->
    <section class="mix-manager" aria-label="Saved mixes">
      <div id="mix-tabs" class="mix-manager__tabs"></div>
      <button id="show-comparison-btn" class="btn btn--secondary" hidden>
        Compare All Mixes
      </button>
    </section>

    <!-- ── Comparison table ──────────────────────────────────────────────── -->
    <section id="comparison-section" class="simulator-comparison" hidden aria-label="Mix comparison">
      <h2 class="simulator-comparison__title">Mix Comparison</h2>
      <div id="comparison-table-container"></div>
    </section>

    <!-- ── Amortization schedule ─────────────────────────────────────────── -->
    <section id="amortization-section" class="simulator-amort" hidden aria-label="Amortization schedule">
      <h2 id="amortization-title" class="simulator-amort__title">Amortization Schedule</h2>
      <div id="amortization-table-container" class="simulator-amort__table-wrapper"></div>
    </section>

    <!-- ── PDF download ──────────────────────────────────────────────────── -->
    <div class="simulator-pdf">
      <button id="pdf-btn" class="btn btn--secondary" hidden>
        Download PDF Summary
      </button>
    </div>

  </main>

  <script src="/shared/authClient.js"></script>
  <script src="/shared/navbar.js"></script>
  <script src="/shared/formatCurrency.js"></script>
  <script src="/shared/formatDecimal.js"></script>
  <script src="/shared/validationService.js"></script>
  <script src="/shared/validationMessage.js"></script>
  <script src="/shared/disclaimerBox.js"></script>

  <script src="/simulator/simulatorForm.js"></script>
  <script src="/simulator/comparisonTable.js"></script>
  <script src="/simulator/simulator-ui.js"></script>

  <script>
    if (window.DisclaimerBox) {
      window.DisclaimerBox.render(document.getElementById('disclaimer'));
    }
  </script>

</body>
</html>
